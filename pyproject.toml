[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strands-omnivoice"
version = "0.1.0"
description = "OmniVoice multilingual zero-shot TTS toolkit for Strands Agents — voice cloning, voice design, and 600+ language synthesis as agent tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Cagatay Cali", email = "cagataycali@icloud.com"}
]
keywords = [
    "strands",
    "agents",
    "omnivoice",
    "tts",
    "text-to-speech",
    "voice-cloning",
    "voice-design",
    "multilingual",
    "zero-shot",
    "diffusion",
    "speech-synthesis",
    "k2-fsa",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "strands-agents",
    "omnivoice>=0.1.5",
    "soundfile>=0.12.0",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "ruff",
]
demo = [
    "gradio",
]
all = [
    "strands-agents-tools",
    "gradio",
    "pytest>=7.0",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/cagataycali/strands-omnivoice"
Repository = "https://github.com/cagataycali/strands-omnivoice"
Issues = "https://github.com/cagataycali/strands-omnivoice/issues"
Documentation = "https://cagataycali.github.io/strands-omnivoice"
Upstream = "https://github.com/k2-fsa/OmniVoice"

[tool.setuptools.packages.find]
where = ["."]
include = ["strands_omnivoice*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

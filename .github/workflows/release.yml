name: Release to PyPI

# Push a tag matching v*.*.* to publish:
#   git tag -a v0.1.1 -m "release v0.1.1"
#   git push origin v0.1.1
#
# Requires repo secret: PYPI_API_TOKEN (set in Settings → Secrets and variables → Actions)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.1) — must match pyproject.toml'
        required: true
        type: string

permissions:
  contents: write   # to create the GitHub Release
  id-token: write   # harmless when using token auth

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Extract version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Verify pyproject.toml version matches tag
        run: |
          PYPROJECT_VERSION=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG_VERSION="${{ steps.get_version.outputs.version }}"
          echo "pyproject.toml: $PYPROJECT_VERSION"
          echo "tag:            $TAG_VERSION"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch — pyproject.toml=$PYPROJECT_VERSION but tag=v$TAG_VERSION"
            echo "::error::Bump pyproject.toml's version to $TAG_VERSION before tagging."
            exit 1
          fi

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify build artifacts
        run: |
          ls -lh dist/
          twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: strands-omnivoice ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 🔊 strands-omnivoice ${{ github.ref_name }}

            **Multilingual zero-shot TTS for Strands Agents — voice cloning, voice design, and 600+ language synthesis.**

            ### 📦 Install
            ```bash
            pip install strands-omnivoice==${{ steps.get_version.outputs.version }}
            ```

            ### 🔄 Upgrade
            ```bash
            pip install --upgrade strands-omnivoice
            ```

            ### 📚 Links
            - 📖 Docs: https://cagataycali.github.io/strands-omnivoice
            - 🌍 [646-language showcase](https://cagataycali.github.io/strands-omnivoice/showcase/)
            - 🐍 PyPI: https://pypi.org/project/strands-omnivoice/${{ steps.get_version.outputs.version }}/

            ---
            *Auto-generated changelog below.*
          files: dist/*

      - name: Summary
        run: |
          echo "## 🎉 Released strands-omnivoice ${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🐍 PyPI: https://pypi.org/project/strands-omnivoice/${{ steps.get_version.outputs.version }}/" >> $GITHUB_STEP_SUMMARY
          echo "- 🏷  Tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Install: \`pip install strands-omnivoice==${{ steps.get_version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY

<svg width="290" height="463" viewBox="0 0 290 463" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="strands-omnivoice">
  <title>strands-omnivoice — multilingual zero-shot TTS for Strands Agents</title>
  <defs>
    <!-- Strands green -->
    <linearGradient id="greenStrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF77"/>
      <stop offset="50%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#00FF77"/>
    </linearGradient>
    <!-- Voice gradient: warm orange/pink — speech, sound, expressiveness -->
    <linearGradient id="voiceStrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="35%" stop-color="#FB923C"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <!-- Glow ring around the mic node -->
    <radialGradient id="micGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FCA5A5" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#F472B6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb1" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FCA5A5" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <!-- Mic body radial -->
    <radialGradient id="micBody" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FCA5A5"/>
      <stop offset="80%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </radialGradient>
    <filter id="softglow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="bigglow"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="starglow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ====== GREEN STRAND (Strands identity) ====== -->
  <path d="M259.147 0.981812C271.389 -2.57498 284.197 4.46571 287.754 16.7074C291.311 28.9492 284.27 41.757 272.028 45.3138L71.1727 103.671C40.7142 112.521 37.1976 154.262 65.7459 168.083L241.343 253.093C307.872 285.302 299.794 382.546 228.862 403.336L30.4041 461.502C18.1707 465.088 5.34708 458.078 1.76153 445.844C-1.8239 433.611 5.18637 420.787 17.4197 417.202L215.878 359.035C246.277 350.125 249.739 308.449 221.226 294.645L45.6297 209.635C-20.9834 177.386 -12.7772 79.9893 58.2928 59.3402L259.147 0.981812Z" fill="#00FF77"/>

  <!-- ====== VOICE STRAND ====== -->

  <!-- Soft glow halos at peaks — sound emanating -->
  <ellipse cx="105" cy="80" rx="36" ry="24" fill="url(#orb1)" filter="url(#bigglow)"/>
  <ellipse cx="200" cy="155" rx="32" ry="22" fill="url(#orb3)" filter="url(#bigglow)"/>
  <ellipse cx="75" cy="240" rx="34" ry="22" fill="url(#orb2)" filter="url(#bigglow)"/>
  <ellipse cx="20" cy="345" rx="30" ry="22" fill="url(#orb1)" filter="url(#bigglow)"/>
  <ellipse cx="140" cy="400" rx="32" ry="22" fill="url(#orb3)" filter="url(#bigglow)"/>

  <!-- Voice strand main path -->
  <path d="M97.3 52.8 C102 75, 105 90, 108 103.8 C130 112, 170 122, 201.5 130.2 C204 145, 205 160, 205.9 176.3 C175 190, 145 205, 118.4 218.7 C85 232, 55 248, 31 261.1 C22 290, 14 318, 9.8 344.5 C40 358, 65 370, 96.3 383.7 C130 393, 160 402, 189.6 411"
        stroke="url(#voiceStrand)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92"/>
  <path d="M97.3 52.8 C102 75, 105 90, 108 103.8 C130 112, 170 122, 201.5 130.2 C204 145, 205 160, 205.9 176.3 C175 190, 145 205, 118.4 218.7 C85 232, 55 248, 31 261.1 C22 290, 14 318, 9.8 344.5 C40 358, 65 370, 96.3 383.7 C130 393, 160 402, 189.6 411"
        stroke="#FFE4E6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.35"/>

  <!-- ====== MICROPHONE NODE — center "voice" anchor at the strand crossing ====== -->
  <g transform="translate(118.4, 218.7)">
    <!-- Soft outer glow -->
    <circle r="30" fill="url(#micGlow)" filter="url(#softglow)"/>
    <!-- Mic stand triangle -->
    <line x1="0" y1="13" x2="0" y2="20" stroke="#831843" stroke-width="1.5" opacity="0.7"/>
    <line x1="-7" y1="20" x2="7" y2="20" stroke="#831843" stroke-width="1.5" opacity="0.7"/>
    <!-- Capsule body -->
    <rect x="-7" y="-13" width="14" height="22" rx="7" fill="url(#micBody)" stroke="#FCA5A5" stroke-width="0.8"/>
    <!-- Capsule grille lines -->
    <line x1="-4.5" y1="-9" x2="4.5" y2="-9" stroke="#FFFFFF" stroke-width="0.6" opacity="0.5"/>
    <line x1="-4.5" y1="-5" x2="4.5" y2="-5" stroke="#FFFFFF" stroke-width="0.6" opacity="0.5"/>
    <line x1="-4.5" y1="-1" x2="4.5" y2="-1" stroke="#FFFFFF" stroke-width="0.6" opacity="0.5"/>
    <line x1="-4.5" y1="3" x2="4.5" y2="3" stroke="#FFFFFF" stroke-width="0.6" opacity="0.5"/>
    <!-- Highlight -->
    <ellipse cx="-2" cy="-8" rx="1.5" ry="3" fill="white" opacity="0.5"/>

    <!-- Concentric soundwave rings — animated -->
    <circle r="14" fill="none" stroke="#F472B6" stroke-width="1" opacity="0.85">
      <animate attributeName="r" from="14" to="24" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.85" to="0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="none" stroke="#FB923C" stroke-width="1" opacity="0.7">
      <animate attributeName="r" from="14" to="28" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.7" to="0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.55">
      <animate attributeName="r" from="14" to="32" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.55" to="0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ====== WAVEFORM BARS along the strand — animated EQ ====== -->
  <g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.92">
    <line x1="108" y1="103.8" x2="108" y2="103.8" transform="translate(0,-2)">
      <animate attributeName="y1" values="98;87;94;83;98" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="110;120;115;124;110" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="116" y1="106" x2="116" y2="106">
      <animate attributeName="y1" values="100;88;96;90;100" dur="0.95s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="112;124;116;122;112" dur="0.95s" repeatCount="indefinite"/>
    </line>
    <line x1="124" y1="108" x2="124" y2="108">
      <animate attributeName="y1" values="102;92;98;88;102" dur="1.25s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="114;126;118;128;114" dur="1.25s" repeatCount="indefinite"/>
    </line>
  </g>

  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="195" y1="125" x2="195" y2="138">
      <animate attributeName="y1" values="121;112;126;115;121" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="138;148;132;145;138" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="201" y1="128" x2="201" y2="141">
      <animate attributeName="y1" values="124;115;121;110;124" dur="0.85s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="142;152;146;156;142" dur="0.85s" repeatCount="indefinite"/>
    </line>
    <line x1="207" y1="132" x2="207" y2="144">
      <animate attributeName="y1" values="128;120;125;116;128" dur="1.35s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="144;154;148;158;144" dur="1.35s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ====== Multi-language symbols floating along the strand ====== -->
  <!-- "A" Latin -->
  <text x="73" y="73" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" opacity="0.85" filter="url(#starglow)">A
    <animate attributeName="opacity" values="0.4;0.95;0.4" dur="3s" repeatCount="indefinite"/>
  </text>
  <!-- 中 Chinese -->
  <text x="155" y="148" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" opacity="0.85" filter="url(#starglow)">中
    <animate attributeName="opacity" values="0.95;0.4;0.95" dur="3.4s" repeatCount="indefinite"/>
  </text>
  <!-- ا Arabic -->
  <text x="60" y="256" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" opacity="0.85" filter="url(#starglow)">ا
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="3.1s" repeatCount="indefinite"/>
  </text>
  <!-- 日 Japanese -->
  <text x="38" y="335" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" opacity="0.8" filter="url(#starglow)">日
    <animate attributeName="opacity" values="0.95;0.45;0.95" dur="2.7s" repeatCount="indefinite"/>
  </text>
  <!-- Ω Greek -->
  <text x="160" y="395" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" opacity="0.85" filter="url(#starglow)">Ω
    <animate attributeName="opacity" values="0.4;0.95;0.4" dur="3.6s" repeatCount="indefinite"/>
  </text>
  <!-- ñ Spanish -->
  <text x="178" y="118" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" opacity="0.8" filter="url(#starglow)">ñ
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.9s" repeatCount="indefinite"/>
  </text>

  <!-- ====== Endpoint sound burst ====== -->
  <g transform="translate(189.6, 411)">
    <circle r="14" fill="url(#orb3)" filter="url(#bigglow)"/>
    <circle r="5" fill="#F472B6"/>
    <circle r="2" fill="white" opacity="0.9"/>
    <circle r="8" fill="none" stroke="#F472B6" stroke-width="0.9" opacity="0.7">
      <animate attributeName="r" from="6" to="18" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.7" to="0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Start point: sun/star -->
  <g transform="translate(97.3, 52.8)">
    <circle r="11" fill="url(#orb1)" filter="url(#bigglow)"/>
    <circle r="4.5" fill="#FDE68A" filter="url(#starglow)"/>
    <circle r="1.5" fill="white"/>
  </g>

  <!-- ====== Scatter sparkles ====== -->
  <g fill="#FFFFFF">
    <circle cx="85" cy="68"  r="1.2" opacity="0.85" filter="url(#starglow)"/>
    <circle cx="115" cy="88" r="0.8" opacity="0.6"/>
    <circle cx="160" cy="112" r="1" opacity="0.7" filter="url(#starglow)"/>
    <circle cx="218" cy="150" r="1.1" opacity="0.7" filter="url(#starglow)"/>
    <circle cx="195" cy="195" r="0.7" opacity="0.6"/>
    <circle cx="160" cy="208" r="1" opacity="0.8" filter="url(#starglow)"/>
    <circle cx="85"  cy="235" r="0.8" opacity="0.6"/>
    <circle cx="50"  cy="252" r="1.2" opacity="0.7" filter="url(#starglow)"/>
    <circle cx="22"  cy="290" r="0.7" opacity="0.5"/>
    <circle cx="15"  cy="320" r="1"   opacity="0.7" filter="url(#starglow)"/>
    <circle cx="55"  cy="375" r="1.1" opacity="0.8" filter="url(#starglow)"/>
    <circle cx="130" cy="395" r="0.7" opacity="0.5"/>
    <circle cx="200" cy="425" r="0.8" opacity="0.6"/>
  </g>

  <!-- Green energy at strand crossings -->
  <circle cx="108" cy="103.8" r="6"  fill="#00FF77" opacity="0.10" filter="url(#softglow)"/>
  <circle cx="118.4" cy="218.7" r="9" fill="#00FF77" opacity="0.12" filter="url(#softglow)"/>
  <circle cx="9.8"  cy="344.5" r="6"  fill="#00FF77" opacity="0.10" filter="url(#softglow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="260" height="186" role="img" aria-label="OmniVoice waveform animation">
  <defs>
    <linearGradient id="hg-strand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="hg-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#60A5FA"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="hg-glow" cx="50%" cy="50%">
      <stop offset="0%"  stop-color="#3B82F6" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="hg-blur"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="hg-soft"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <!-- ambient halo -->
  <ellipse cx="140" cy="100" rx="120" ry="70" fill="url(#hg-glow)" filter="url(#hg-blur)"/>

  <!-- center mic -->
  <g transform="translate(140 100)">
    <circle r="18" fill="url(#hg-glow)" filter="url(#hg-blur)"/>
    <rect x="-9" y="-16" width="18" height="26" rx="9" fill="white" stroke="#1E40AF" stroke-width="1.2"/>
    <line x1="-5" y1="-10" x2="5" y2="-10" stroke="#1E40AF" stroke-width=".7" opacity=".6"/>
    <line x1="-5" y1="-5" x2="5" y2="-5" stroke="#1E40AF" stroke-width=".7" opacity=".6"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#1E40AF" stroke-width=".7" opacity=".6"/>
    <line x1="-5" y1="5" x2="5" y2="5" stroke="#1E40AF" stroke-width=".7" opacity=".6"/>
    <line x1="0" y1="14" x2="0" y2="22" stroke="#1E40AF" stroke-width="1.2"/>
    <line x1="-7" y1="22" x2="7" y2="22" stroke="#1E40AF" stroke-width="1.2"/>

    <!-- pulsing rings -->
    <circle r="20" fill="none" stroke="#3B82F6" stroke-width="1" opacity=".9">
      <animate attributeName="r" from="20" to="50" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from=".9" to="0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="20" fill="none" stroke="#8B5CF6" stroke-width="1" opacity=".7">
      <animate attributeName="r" from="20" to="60" dur="2.8s" begin=".9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from=".7" to="0" dur="2.8s" begin=".9s" repeatCount="indefinite"/>
    </circle>
    <circle r="20" fill="none" stroke="#EC4899" stroke-width="1" opacity=".5">
      <animate attributeName="r" from="20" to="72" dur="2.8s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from=".5" to="0" dur="2.8s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- equalizer bars left + right -->
  <g fill="url(#hg-bar)">
    <rect x="22" y="80" width="6" height="40" rx="3">
      <animate attributeName="height" values="20;58;30;46;20" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="90;71;85;77;90" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="34" y="70" width="6" height="60" rx="3">
      <animate attributeName="height" values="32;76;40;64;32" dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="84;62;80;68;84" dur="1.05s" repeatCount="indefinite"/>
    </rect>
    <rect x="46" y="78" width="6" height="44" rx="3">
      <animate attributeName="height" values="24;64;36;52;24" dur="1.45s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="88;68;82;74;88" dur="1.45s" repeatCount="indefinite"/>
    </rect>
    <rect x="58" y="74" width="6" height="52" rx="3">
      <animate attributeName="height" values="28;72;38;58;28" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="86;64;81;71;86" dur="1.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="70" y="80" width="6" height="40" rx="3">
      <animate attributeName="height" values="22;54;30;42;22" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="89;72;85;79;89" dur="1.3s" repeatCount="indefinite"/>
    </rect>

    <rect x="204" y="80" width="6" height="40" rx="3">
      <animate attributeName="height" values="22;52;30;46;22" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="89;74;85;77;89" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="216" y="76" width="6" height="48" rx="3">
      <animate attributeName="height" values="26;68;36;52;26" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="87;66;82;74;87" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="228" y="70" width="6" height="60" rx="3">
      <animate attributeName="height" values="32;78;42;62;32" dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="84;61;79;69;84" dur="1.05s" repeatCount="indefinite"/>
    </rect>
    <rect x="240" y="78" width="6" height="44" rx="3">
      <animate attributeName="height" values="24;58;36;48;24" dur="1.35s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="88;71;82;76;88" dur="1.35s" repeatCount="indefinite"/>
    </rect>
    <rect x="252" y="82" width="6" height="36" rx="3">
      <animate attributeName="height" values="18;48;28;38;18" dur="1.25s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="91;76;86;81;91" dur="1.25s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- multilingual sparkles -->
  <g font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="13" fill="white" filter="url(#hg-soft)">
    <text x="40" y="34" opacity=".85">A
      <animate attributeName="opacity" values=".4;.95;.4" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="80" y="22" opacity=".75">中
      <animate attributeName="opacity" values=".95;.4;.95" dur="3.4s" repeatCount="indefinite"/>
    </text>
    <text x="200" y="34" opacity=".75">日
      <animate attributeName="opacity" values=".4;.95;.4" dur="3.7s" repeatCount="indefinite"/>
    </text>
    <text x="234" y="20" opacity=".7">ا
      <animate attributeName="opacity" values=".9;.45;.9" dur="3.1s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="178" opacity=".7">ñ
      <animate attributeName="opacity" values=".4;.85;.4" dur="2.8s" repeatCount="indefinite"/>
    </text>
    <text x="220" y="184" opacity=".7">Ω
      <animate attributeName="opacity" values=".85;.4;.85" dur="3.2s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
